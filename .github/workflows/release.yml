name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the theme version
        run: |
          version="$(sed -n 's/^Version: *//p' style.css | tr -d '\r')"
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "style.css says $version, tag is ${GITHUB_REF_NAME}"; exit 1; }

      - name: Build emmen.zip
        run: |
          mkdir -p "$RUNNER_TEMP/build/emmen"
          rsync -a --exclude-from=.distignore ./ "$RUNNER_TEMP/build/emmen/"
          (cd "$RUNNER_TEMP/build" && zip -rq "$GITHUB_WORKSPACE/emmen.zip" emmen)
          unzip -l emmen.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: emmen.zip
          make_latest: true
          generate_release_notes: true
